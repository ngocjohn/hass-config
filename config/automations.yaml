- id: '1788738472677'
  alias: Air Purifier Aqi
  description: ''
  triggers:
  - trigger: air_quality.pm25_crossed_threshold
    target:
      entity_id: sensor.zhimi_mb4_b008_pm25_density
    options:
      behavior: each
      for:
        hours: 0
        minutes: 1
        seconds: 0
      threshold:
        type: above
        value:
          active_choice: number
          number: 50
    id: level_above
    alias: level obove 50
  - trigger: air_quality.pm25_crossed_threshold
    target:
      entity_id: sensor.zhimi_mb4_b008_pm25_density
    options:
      behavior: each
      for:
        hours: 0
        minutes: 5
        seconds: 0
      threshold:
        type: below
        value:
          active_choice: number
          number: 10
    id: level_bellow
    alias: level bellow 40
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - level_above
      - condition: not
        conditions:
        - condition: state
          entity_id: fan.zhimi_mb4_b008_air_purifier
          state:
          - Favorite
          attribute: preset_mode
      sequence:
      - action: fan.set_preset_mode
        metadata: {}
        data:
          preset_mode: Favorite
        target:
          entity_id: fan.zhimi_mb4_b008_air_purifier
    - conditions:
      - condition: trigger
        id:
        - level_bellow
      sequence:
      - action: fan.set_preset_mode
        metadata: {}
        target:
          entity_id: fan.zhimi_mb4_b008_air_purifier
        data:
          preset_mode: Auto
  mode: restart
