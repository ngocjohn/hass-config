- id: '1786050352078'
  alias: Camera Event Snapshot
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.doorway_streaming
    - binary_sensor.terasa_streaming
    - binary_sensor.kids_room_streaming
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 10
    id: streaming
  - trigger: event.received
    target:
      device_id:
      - 0b57f4d5d68e33cddd6f9cb6bca22a05
      - b9a9ff4923b8ea90db2ead1f27e78239
    options:
      event_type:
      - person
      - motion
  - trigger: time_pattern
    hours: /1
    id: time_cron
    enabled: true
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - time_cron
      sequence:
      - repeat:
          for_each:
          - camera.doorway
          - camera.kids_room
          - camera.terasa
          sequence:
          - action: script.turn_on
            data:
              variables:
                camera_entity: '{{repeat.item}}'
            target:
              entity_id: script.cam_snapshot_tmp
          - delay:
              hours: 0
              minutes: 0
              seconds: 7
              milliseconds: 0
      - action: delete.files_in_folder
        metadata: {}
        data:
          folder: /config/www/tmp/snapshot/
          time: 3600
          no_warn: true
          only_extensions:
          - .png
          - .jpg
    - conditions:
      - condition: trigger
        id:
        - streaming
        enabled: true
      sequence:
      - action: script.turn_on
        data:
          variables:
            camera_entity: '{{trigger.to_state.entity_id}}'
        target:
          entity_id: script.cam_snapshot_tmp
    enabled: true
  mode: single
