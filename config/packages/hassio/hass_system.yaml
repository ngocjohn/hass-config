# RECORDER - https://www.home-assistant.io/integrations/recorder/
recorder:
  db_url: !secret mariadb_url
  purge_keep_days: 30
  auto_purge: true
  auto_repack: true
  exclude:
    domains:
      # - alarm_control_panel
      # - camera
      - button
      - media_player
      - switch
      - light
      - sun
      - weather
      - timer
      - update
      # - image
      - device_tracker
    entities:
      - sensor.time
      - sensor.date
      - sensor.hassio_addons_use
      - sensor.zhimi_mb4_b008_moto_speed_rpm
      - sensor.zhimi_mb4_b008_pm25_density
      - script.fade_music
      - sensor.motion_detected
      - sensor.tx
      - sensor.rx
      - camera.roidmi_eve_live_map
      - sensor.unifi_gateway
      - sensor.mbpro_uptime_usage
    entity_globs:
      - sensor.*_motor_speed
      - sensor.browser_*
      - binary_sensor.browser_*
      - sensor.*_color
      - sensor.*_energy
      - sensor.*_power
      - sensor.*_linkquality
      - sensor.*_last_seen
      - sensor.home_*
      - sensor.kodi_*
      - sensor.amg_43_*
      - sensor.*_write
      - sensor.prague_next_*
      - sensor.*_utilization
      - sensor.*_clients
      - sensor.*_voltage
      - sensor.*_current
      - sensor.*_rx
      - sensor.*_tx
      - sensor.*_active
      - sensor.hacs_*
      - sensor.motion_sensor_*
      - sensor.*_outage_count
      - sensor.*_speed_rpm
      - sensor.*_clients
      - sensor.*_containers_cpu_usage
      - sensor.roidmi_*
      - binary_sensor.roidmi_*
      - sensor.unifi_*_stats
      - sensor.*_stargazers
      - sensor.arris_*
      - sensor.raspberry_pi_docker_*
      - sensor.macbook_pro_server_*
      - fan.philips_air_*
      - humidifier.philips_air_*
      - sensor.philips_air_*
      - sensor.*_device_temperature
      - sensor.*_rssi
      - sensor.prague_moon_*
      - sensor.*_cpu_usage_total
      - sensor.soccer_live_*
      - sensor.*_link_speed
      - sensor.tx_*
      - sensor.*_latency
      - sensor.neklanka_gateway_*
      - sensor.rx_*
      - sensor.kids_room_*
      - sensor.tmdb_*
  include:
    entities:
      - device_tracker.viet_ngoc_samsung
      - device_tracker.phuong_chi
      - device_tracker.amg_43_parking_location
      - sensor.motion_sensor_entrance_illuminance
      - sensor.neklanka_gateway_download
      - sensor.neklanka_gateway_upload
      - light.living_room_floor_lamp
      - light.shelly_dimmer
      - light.shelly_rgbw_kitchen_led_strip
      - light.kitchen_main_light
      - light.kitchen_table_light
      - light.hood_lighting
      - light.bathroom_main_light
      - light.bathroom_mirror_light
      - light.bedroom_closet_light
      - light.bedroom_main_light
      - light.shower_room_main_light
      - light.shower_room_mirror_light
      - light.bedroom_bed_light
      - light.aqara_hub
      - light.utility_room_light
      - light.hallway_light
      - light.office_lamp_bulb
      - light.office_main_light
      - light.office_shelf_led
      - light.office_ripple_mood_light
      - light.office_led_light_strip
      - light.bedroom_ripple_mood_light
      - light.sony_tv_backlight

# ACTIVITY LOGBOOK - https://www.home-assistant.io/integrations/logbook/
logbook:
  exclude:
    entity_globs:
      - sensor.browser_*
      - binary_sensor.browser_*

# LOGGER https://www.home-assistant.io/integrations/system_log/
logger:
  filters:
    pyhap.hap_handler:
      - "Client \\('192\\.168\\.1\\.16', \\d+\\) with uuid .* attempted pair verify without being paired first"
system_log:
  fire_event: true

# TTS
tts:
  - platform: google_translate
  - platform: google_cloud
    key_file: google_stt.json
  - platform: edge_tts
    service_name: edge_eng_say
    language: en-US-JennyNeural
  - platform: edge_tts
    service_name: edge_vietnam_say
    language: vi-VN-HoaiMyNeural
bluetooth:
delete:
sun:
