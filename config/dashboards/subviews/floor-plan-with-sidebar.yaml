title: floor-plan-with-sidebar
path: floorplan-with-sidebar
type: sidebar
icon: mdi:home-floor-0
subview: false
cards:
  - type: horizontal-stack
    view_layout:
      position: sidebar
    cards:
      - &button_toggle
        type: button
        show_name: false
        show_icon: true
        show_state: true
        icon_height: 15px
        entity: input_boolean.test_floorplan_card_inside
      - <<: *button_toggle
        entity: input_boolean.brma
  - type: vertical-stack
    view_layout:
      position: sidebar
    cards:
      - type: custom:streamline-card
        template: popup_security_sensors
        variables:
          title: Motion
          group_entity_id: group.motion_sensors
      - type: custom:streamline-card
        template: popup_camera_webrtc_local
        variables:
          camera_entity: camera.kids_room
      - type: custom:streamline-card
        template: popup_camera_webrtc_local
        variables:
          camera_entity: camera.doorway
      - type: custom:streamline-card
        template: popup_camera_webrtc_local
        variables:
          camera_entity: camera.terasa
    visibility:
      - condition: state
        entity: input_boolean.brma
        state: 'on'

  - type: vertical-stack
    view_layout:
      position: main
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:floorplan-card
            card_mod:
              style: |
                ha-card {
                  margin: 0;
                  background: transparent;
                  box-shadow: none;
                  border-radius: none;
                  border: none;
                }
                .content {
                  padding: 0;
                  background: radial-gradient(circle, rgba(255, 255, 255, 0.13) 0%, transparent 25%);
                }
            full_height: true
            config:
              # console_log_level: debug
              image: /local/hafloor/plan_opt.svg
              stylesheet: /local/hafloor/style.css
              rules: !include_dir_merge_list /config/dashboards/floorplan/
visible:
  - !include ../shared/visibility_view.yaml
