## DASHBOARD GRID CAMERAS ##

# CAM DOOR
grid_cam_door:
  card:
    type: custom:button-card
    entity: camera.doorway
    name: ' '
    hold_action: !include ../../shared/popup/cameras.yaml
    variables:
      battery: sensor.doorway_battery
      image_entity: image.doorway_snapshot_event_image
    template:
      - camera
# CAM KIDS ROOM
grid_cam_kids:
  card:
    type: custom:button-card
    entity: camera.kids_room
    name: ' '
    hold_action: !include ../../shared/popup/cameras.yaml
    template:
      - camera
    variables:
      battery: 'sensor.doorway_battery'
      # stream_status: 'sensor.kids_room_stream_status'
      image_entity: 'image.kids_room_snapshot_event_image'

# CAM TERRACE
grid_cam_terrace:
  card:
    type: custom:button-card
    entity: camera.terasa
    name: ' '
    hold_action: !include ../../shared/popup/cameras.yaml
    template:
      - camera
    variables:
      battery: sensor.terasa_battery
      image_entity: image.terasa_snapshot_event_image

  # CAM GARDEN
grid_cam_garden:
  card:
    type: custom:button-card
    entity: camera.zahrada
    name: ' '
    hold_action: !include ../../shared/popup/cameras.yaml
    template:
      - camera
      - loader
    variables:
      battery: sensor.zahrada_battery
      # image_entity: image.zahrada_event_image

popup_camera_webrtc:
  default:
    - camera_entity: camera.doorway
  card:
    type: custom:webrtc-camera
    entity: '[[camera_entity]]'
    poster: '[[camera_entity]]'
    ui: true
    shortcuts:
      - name: Play
        icon: mdi:play
        service: camera.turn_on
        service_data:
          entity_id: '[[camera_entity]]'
      - name: Stop
        icon: mdi:stop
        service: camera.turn_off
        service_data:
          entity_id: '[[camera_entity]]'
    uix:
      style: |
        ha-card {
          {% if is_state(config.entity, "streaming") %}
          border: 2px solid red !important;
          {% endif %}
        }
popup_camera_webrtc_local:
  default:
    - camera_entity: camera.doorway
  card:
    type: custom:webrtc-camera
    entity: '[[camera_entity]]'
    poster: '[[camera_entity]]'
    server: http://192.168.1.189:1984/
    ui: true
