## DASHBOARD GRID CAMERAS ##

# CAM DOOR
grid_cam_door:
  card:
    type: custom:button-card
    entity: camera.doorway
    name: ' '
    hold_action: !include ../../shared/popup/cameras.yaml
    variables:
      battery: sensor.doorway_battery
      image_entity: image.doorway_snapshot_event_image
    template:
      - camera
      - loader
    styles:
      card:
        - background-position: center
  # CAM KIDS ROOM
grid_cam_kids:
  card:
    type: custom:button-card
    entity: camera.kids_room
    name: ' '
    hold_action: !include ../../shared/popup/cameras.yaml
    template:
      - camera
      - icon_cam_dot
      - loader
    variables:
      battery: 'sensor.doorway_battery'
      # stream_status: 'sensor.kids_room_stream_status'
      image_entity: 'image.kids_room_snapshot_event_image'

    # double_tap_action:
    #   action: fire-dom-event
    #   browser_mod:
    #     service: browser_mod.popup
    #     data:
    #       title: 'Kids Room'
    #       content:
    #         type: custom:webrtc-camera
    #         entity: camera.kids_room_camera
    styles:
      card:
        - background-position: center

grid_cam_kids_room:
  card:
    type: picture-entity
    show_state: true
    show_name: false
    camera_view: auto
    entity: camera.kids_room_camera
    camera_image: camera.kids_room_camera

# CAM TERRACE
grid_cam_terrace:
  card:
    type: custom:button-card
    entity: camera.terasa
    name: ' '
    hold_action: !include ../../shared/popup/cameras.yaml
    template:
      - camera
      - loader
    variables:
      battery: sensor.terasa_battery
      image_entity: image.terasa_snapshot_event_image
